replicaCount: 1

image:
  repository: ghcr.io/florisfeddema/extended-ceph-exporter
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

config:
  metricsPath: "/metrics"
  requestTimeout: "10s"
  rgwCacheTtl: "5s"
  selfMetricsEnabled: false
  logLevel: info

rgw:
  adminEndpoint: ""
  credentials:
    existingSecret:
      name: ""
      accessKeyKey: AccessKey
      secretKeyKey: SecretKey
    create: false
    secretName: ""
    accessKeyKey: AccessKey
    secretKeyKey: SecretKey
    accessKey: ""
    secretKey: ""

service:
  type: ClusterIP
  annotations: {}
  labels: {}

serviceMonitor:
  enabled: false
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  honorLabels: false
  additionalEndpoints: []

grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"
  annotations: {}

rook:
  clusterNamespace: rook-ceph
  objectStoreUser:
    enabled: false
    # Defaults to the chart fullname.
    name: ""
    namespace: ""
    store: ""
    # Defaults to the resolved object-store user name.
    displayName: ""
    # Defaults to Rook's generated Secret name:
    # rook-ceph-object-user-<store>-<resolved user name>.
    secretName: ""
    # Read-only RGW Admin Ops capabilities required by the exporter.
    capabilities:
      info: read
      user: read
      buckets: read
      metadata: read
      usage: read
      zone: read
    opMask:
      - read

resources: {}

podDisruptionBudget:
  enabled: true
  # If set, minAvailable is used. Otherwise maxUnavailable is used.
  minAvailable: null
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "extended-ceph-exporter.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "extended-ceph-exporter.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'

nodeSelector: {}
tolerations: []
affinity: {}
