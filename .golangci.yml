linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gofmt
    - gosimple

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # Test helpers and table-driven tests routinely shadow err.
    - path: "_test\\.go"
      linters:
        - errcheck
